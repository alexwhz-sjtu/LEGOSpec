mode: two_stage
launcher:
  target_model: ./models/teacher
  teacher_draft: ./models/teacher_draft
  train_data: ./data/answers.jsonl
  output_dir: ./runs/dlite_two_stage/checkpoints
  nnodes: 1
  node_rank: 0
  nproc_per_node: 8
  master_addr: 127.0.0.1
  master_port: 29505
arguments:
  target_model_backend: sglang
  sglang_attention_backend: fa3
  sglang_mem_fraction_static: 0.4
  sglang_ep_size: 1
  attention_backend: flex_attention
  flex_attention_backend: TRITON
  chat_template: qwen
  max_length: 4096
  batch_size: 1
  accumulation_steps: 1
  tp_size: 1
  shard_draft_by_tp: false
  dist_timeout: 1200
  num_anchors: 512
  stage1_epochs: 1
  stage2_epochs: 6
  learning_rate: 0.0004
  weight_decay: 0.0
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  use_muon: false
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_weight_decay: 0.1
  muon_matrices_per_rank: 1
  muon_adamw_lr: 0.0004
  muon_adamw_weight_decay: 0.1
  seed: 42
  stage1_kl_weight: 1.0
  stage1_loss_decay_gamma: null
  stage2_final_ce_weight: 1.0
  stage2_l1_weight: 1.0
  stage2_base_ce_weight: 0.0
  stage2_loss_decay_gamma: null
  stage2_base_ce_decay_gamma: null
  cache_dir: ./cache/training
  build_dataset_num_proc: 8
  dataloader_num_workers: 8
  log_interval: 50
  save_interval: 20000
  report_to: wandb
  wandb_project: legospec-handoff
  disaggregate: false
  target_ranks_per_node: 4
  draft_ranks_per_node: 4
  target_tp_size: 1
  node_batch_size: 4
  draft_micro_batch_size: 1
  pipeline_depth: 2
  profile: false
