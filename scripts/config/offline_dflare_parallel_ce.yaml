algorithm: composable
launcher:
  target_model: /path/to/Qwen3-4B
  output_dir: /path/to/data/training/ce/checkpoints
  nnodes: 1
  node_rank: 0
  nproc_per_node: 2
  master_addr: 127.0.0.1
  master_port: 29721
  train_hidden_states: /path/to/data/hidden/full80k/cache
arguments:
  draft_config: configs/composable_dflare_parallel_ce.json
  target_model_backend: hf
  sglang_attention_backend: fa3
  sglang_mem_fraction_static: 0.3
  sglang_ep_size: 1
  attention_backend: flex_attention
  flex_attention_backend: TRITON
  chat_template: qwen
  max_length: 4096
  batch_size: 4
  accumulation_steps: 1
  tp_size: 1
  shard_draft_by_tp: false
  dist_timeout: 1200
  block_size: 8
  num_draft_layers: 5
  num_anchors: 512
  num_epochs: 6
  learning_rate: 0.0006
  weight_decay: 0.0
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  use_muon: true
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  muon_matrices_per_rank: 1
  muon_adamw_lr: 0.0006
  muon_adamw_weight_decay: 0.0
  seed: 42
  objective_chunk_blocks: 512
  cache_dir: /path/to/data/preprocessed/training
  build_dataset_num_proc: 16
  dataloader_num_workers: 2
  log_interval: 50
  save_interval: 5000
  report_to: wandb
  wandb_project: spec-decoding
  wandb_name: offline_dflare_parallel_ce
  disaggregate: false
  profile: false
  verify_hidden_cache_checksums: false
