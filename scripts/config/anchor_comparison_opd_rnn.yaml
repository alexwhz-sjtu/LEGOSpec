algorithm: composable
launcher:
  target_model: ./models/teacher
  train_hidden_states: ./data/hidden/cache
  output_dir: ./runs/anchor_comparison_opd_rnn/checkpoints
  nnodes: 1
  node_rank: 0
  nproc_per_node: 8
  master_addr: 127.0.0.1
  master_port: 29830
arguments:
  complete_blocks: true
  opd_data_mode: sampled_anchor
  opd_target_chunk_anchors: 0
  init_from: ./models/initial_draft
  draft_config: configs/27__dflash__gqa5_dense__rnn_r256__opd_survival_b1_d0p8_w1.json
  target_model_backend: hf
  attention_backend: flex_attention
  flex_attention_backend: TRITON
  gdn_backend: fla
  chat_template: qwen
  max_length: 4096
  batch_size: 2
  accumulation_steps: 1
  tp_size: 1
  shard_draft_by_tp: false
  dist_timeout: 1200
  block_size: 8
  num_draft_layers: 5
  num_anchors: 512
  num_epochs: 4
  learning_rate: 0.0003
  weight_decay: 0.0
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  use_muon: true
  muon_lr: 0.01
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  muon_matrices_per_rank: 1
  muon_adamw_lr: 0.0003
  muon_adamw_weight_decay: 0.0
  seed: 42
  objective_chunk_blocks: 0
  cache_dir: ./cache/training
  build_dataset_num_proc: 16
  dataloader_num_workers: 2
  log_interval: 20
  save_interval: 5000
  save_strategy: final_only
  save_training_state: false
  report_to: none
  disaggregate: false
  profile: false
  verify_hidden_cache_checksums: false
  anchor_sampling: sample_epoch
