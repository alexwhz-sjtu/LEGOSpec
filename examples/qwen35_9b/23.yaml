algorithm: composable
launcher:
  target_model: ./models/Qwen3.5-9B
  train_hidden_states: ./data/qwen35_9b/hidden/cache
  output_dir: ./runs/qwen35_9b/23/checkpoints
  nnodes: 1
  node_rank: 0
  nproc_per_node: 8
  master_addr: 127.0.0.1
  master_port: 29501
arguments:
  draft_config: ./configs/qwen35_9b/23.json
  target_model_backend: sglang
  attention_backend: flex_attention
  flex_attention_backend: TRITON
  gdn_backend: fla
  chat_template: qwen35
  max_length: 4096
  batch_size: 2
  accumulation_steps: 1
  tp_size: 1
  shard_draft_by_tp: false
  dist_timeout: 1200
  block_size: 8
  num_draft_layers: 5
  num_anchors: 512
  num_epochs: 6
  learning_rate: 0.0006
  weight_decay: 0.0
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  use_muon: true
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  muon_matrices_per_rank: 1
  muon_adamw_lr: 0.0006
  muon_adamw_weight_decay: 0.0
  seed: 42
  objective_chunk_blocks: 32
  complete_blocks: true
  cache_dir: ./cache/qwen35_9b/training
  build_dataset_num_proc: 16
  dataloader_num_workers: 2
  log_interval: 50
  save_interval: 5000
  save_strategy: final_only
  save_training_state: false
  report_to: wandb
  wandb_project: legospec-qwen35-9b
  wandb_name: qwen35_9b_23
  disaggregate: false
  profile: false
  verify_hidden_cache_checksums: false
  anchor_sampling: legacy
  supervision_mode: sampled
  opd_data_mode: teacher_forced
