model:
  target_model_path: Qwen/Qwen3-8B
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  lm_head_key: lm_head.weight
  torch_dtype: bfloat16
  flashmtp_history_mode: token
  flashmtp_sliding_window_size: 1
  flashmtp_markov_head_type: markov
  flashmtp_markov_output_mode: additive
  flashmtp_markov_rank: 64
  flashmtp_chs_num_layers: 7
  flashmtp_backbone_conv_enabled: true
  flashmtp_conv_kernel_size: 2
  flashmtp_conv_group_size: 16

data:
  hidden_states_path: ./cache/hidden_states/qwen3-8b-flashmtp-sharegpt
  max_length: 4096
  chat_template: qwen
  cache_dir: ./cache

training:
  strategy: flashmtp
  num_epochs: 6
  max_steps: 10000
  batch_size: 1
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  flashmtp_final_ce_weight: 1.0
  flashmtp_tv_loss_weight: 1.0
  flashmtp_base_lm_ce_weight: 0.0
  save_interval: 1000
  log_interval: 50
  dist_timeout: 30
  seed: 42

run_id: qwen3-8b-flashmtp-offline
output_dir: ./outputs/qwen3-8b-flashmtp-offline

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
